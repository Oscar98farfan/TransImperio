<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área de Clientes | TRANSIMPERIO</title>

    <link rel="stylesheet" href="../css/styles.css?v=20261009c">
    <link rel="stylesheet" href="login.css?v=20261009c">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <img src="../assets/images/logo_simplificado.png" alt="TRANSIMPERIO" class="login-logo">

            <h1>Área de Clientes</h1>

            <p class="login-description">
                Ingresa con tus credenciales para gestionar tus envíos,
                realizar cargas masivas y consultar el estado de tus guías.
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">Usuario</label>

                    <input type="email" id="email" placeholder="correo@empresa.com" autocomplete="username" required>

                </div>

                <div class="input-group">

                    <label for="password">Contraseña</label>

                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="********" autocomplete="current-password"
                            required>
                        <button type="button" class="ver-clave" id="btnVerClave" aria-label="Mostrar contraseña"
                            title="Mostrar contraseña">
                            <svg class="ojo-abierto" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg class="ojo-cerrado" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>

                </div>

                <button type="submit" class="login-btn">
                    Ingresar
                </button>

            </form>

            <div id="mensaje"></div>

            <a href="../index.html" class="back-link">
                ← Volver al sitio web
            </a>

        </div>

    </main>

    <script src="config.js?v=20261009c"></script>
    <script src="login.js?v=20261009c"></script>

</body>

</html>
